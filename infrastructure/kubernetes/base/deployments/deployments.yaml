apiVersion: apps/v1
kind: Deployment
metadata: { name: order-service, namespace: waypoint }
spec:
  replicas: 1
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service, waypoint.io/tier: backend } }
    spec:
      serviceAccountName: waypoint-service
      containers:
        - name: app
          image: waypoint/order-service:dev
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: waypoint-config } }]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: waypoint-database, key: ORDER_DATABASE_URL }
            - { name: DATABASE_SCHEMA, value: orders }
            - { name: SHARED_SERVICE_URL, value: http://shared-service:8080 }
            - { name: PLANNING_SERVICE_URL, value: http://planning-service:8080 }
            - { name: DELIVERY_SERVICE_URL, value: http://delivery-service:8080 }
            - { name: OIDC_TOKEN_URL, value: http://thunderid:8090/oauth2/token }
            - { name: M2M_CLIENT_ID, value: waypoint-order-service }
            - { name: M2M_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: waypoint-m2m, key: ORDER_M2M_CLIENT_SECRET } } }
          readinessProbe: { httpGet: { path: /health/ready, port: 8080 } }
          livenessProbe: { httpGet: { path: /health/live, port: 8080 } }
---
