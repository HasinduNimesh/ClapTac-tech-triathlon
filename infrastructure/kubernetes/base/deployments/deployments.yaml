kind: Deployment
metadata: { name: delivery-service, namespace: waypoint }
spec:
  replicas: 1
  selector: { matchLabels: { app: delivery-service } }
  template:
    metadata: { labels: { app: delivery-service, waypoint.io/tier: backend } }
    spec:
      serviceAccountName: waypoint-service
