apiVersion: v1
kind: ConfigMap
metadata:
  name: waypoint-config
  namespace: waypoint
data:
  ENVIRONMENT: "dev"
  AUTH_DISABLED: "false"
  HTTP_ADDR: ":8080"
  OIDC_AUDIENCE: "waypoint-api"
  OIDC_ISSUER: "http://thunderid:8090"
  OIDC_JWKS_URL: "http://thunderid:8090/oauth2/jwks"
  SHARED_SERVICE_URL: "http://shared-service:8080"
  LLM_BASE_URL: ""
  LLM_MODEL: ""
