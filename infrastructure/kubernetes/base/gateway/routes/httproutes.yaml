apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  namespace: waypoint
spec:
  parentRefs:
    - name: waypoint
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/v1/orders }
      backendRefs:
        - name: order-service
          port: 8080
---
