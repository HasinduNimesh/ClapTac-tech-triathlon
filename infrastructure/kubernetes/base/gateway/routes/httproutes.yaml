apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agent
  namespace: waypoint
spec:
  parentRefs:
    - name: waypoint
  rules:
    # Gateway API prefers the longest matching prefix, so these reach the
    # Python order/dashboard assistants and everything else stays on M7.
    - matches:
        - path: { type: PathPrefix, value: /api/v1/agent/order-assistant }
        - path: { type: PathPrefix, value: /api/v1/agent/dashboard-assistant }
        - path: { type: PathPrefix, value: /api/v1/agent/assistants }
      backendRefs:
        - name: agent-assistants
          port: 8080
    - matches:
        - path: { type: PathPrefix, value: /api/v1/agent }
      backendRefs:
        - name: agent-orchestrator
          port: 8080
