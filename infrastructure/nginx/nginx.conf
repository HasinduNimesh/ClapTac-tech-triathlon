worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;
  client_header_timeout 10s;
  client_body_timeout 30s;
  send_timeout 30s;

  limit_req_zone $binary_remote_addr zone=edge:10m rate=20r/s;

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    # The microphone is allowed for this site only: the order helper takes a spoken order through the
    # browser's speech recognition, which needs it. The loader app below keeps it off.
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https: http://localhost:8090; worker-src 'self' blob:" always;
    limit_req zone=edge burst=40 nodelay;

    location /health/live {
      default_type application/json;
      return 200 '{"status":"live","edge":"nginx"}';
    }

    # Docker Compose may assign a new IP when a service container is rebuilt.
    # Resolve service names at request time instead of pinning an IP when NGINX
    # starts, so a web/service-only rebuild does not leave the gateway stale.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/v1/orders/ { set $backend "order-service:8080"; proxy_pass http://$backend; }
    location /api/v1/orders { set $backend "order-service:8080"; proxy_pass http://$backend; }
    location /api/v1/planning/ { set $backend "planning-service:8080"; proxy_pass http://$backend; }
    location /api/v1/planning { set $backend "planning-service:8080"; proxy_pass http://$backend; }
    location /api/v1/fleet/ { set $backend "fleet-service:8080"; proxy_pass http://$backend; }
    location /api/v1/fleet { set $backend "fleet-service:8080"; proxy_pass http://$backend; }
    location /api/v1/loading/ { set $backend "loading-service:8080"; proxy_pass http://$backend; }
    location /api/v1/loading { set $backend "loading-service:8080"; proxy_pass http://$backend; }
    location /api/v1/delivery/ { set $backend "delivery-service:8080"; proxy_pass http://$backend; client_max_body_size 8m; }
    location /api/v1/delivery { set $backend "delivery-service:8080"; proxy_pass http://$backend; client_max_body_size 8m; }
    location /api/v1/shared/ { set $backend "shared-service:8080"; proxy_pass http://$backend; }
    location /api/v1/shared { set $backend "shared-service:8080"; proxy_pass http://$backend; }
    location /api/v1/integrations/ { set $backend "integration-service:8080"; proxy_pass http://$backend; }
    location /api/v1/integrations { set $backend "integration-service:8080"; proxy_pass http://$backend; }
    # Order and dashboard assistants (longer prefixes win over /api/v1/agent/).
    location /api/v1/agent/order-assistant/ { set $backend "agent-assistants:8080"; proxy_pass http://$backend; proxy_read_timeout 45s; }
    location /api/v1/agent/dashboard-assistant/ { set $backend "agent-assistants:8080"; proxy_pass http://$backend; proxy_read_timeout 45s; }
    location /api/v1/agent/assistants/ { set $backend "agent-assistants:8080"; proxy_pass http://$backend; }
    location /api/v1/agent/ { set $backend "agent-orchestrator:8080"; proxy_pass http://$backend; }
    location /api/v1/agent { set $backend "agent-orchestrator:8080"; proxy_pass http://$backend; }

    # Loader workspace (Flutter web, online-only). Flutter's CanvasKit renderer
    # compiles WebAssembly, so this app's documents allow 'wasm-unsafe-eval'.
    # add_header here replaces the server-level headers, so all are repeated.
    # Sign-in goes to the identity server named in the app's build (OIDC_ISSUER);
    # nothing from the identity server is proxied through this origin.
    location /loader-app/ {
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy same-origin always;
      add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http://localhost:8090; worker-src 'self' blob:" always;
      set $backend "loader-web:80";
      proxy_pass http://$backend;
    }
    location = /loader-app { return 301 /loader-app/; }

    location / {
      set $backend "web:80";
      proxy_pass http://$backend;
    }
  }
}
