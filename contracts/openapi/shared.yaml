openapi: 3.1.0
info:
  title: Waypoint Shared Service
  version: 0.2.0
servers:
  - url: /api/v1
paths:
  /shared/profiles/me:
    get:
      operationId: getMyProfile
      security: [{ bearerAuth: [] }]
      description: Returns the application profile, including its stored displayName (empty until set).
      responses:
        "200": { description: Application profile }
        "401": { description: Unauthenticated }
        "404": { description: User not provisioned }
  /shared/profiles/me/display-name:
    put:
      operationId: updateMyDisplayName
      security: [{ bearerAuth: [] }]
      description: Updates the authenticated person's stored displayName (1-120 characters). The token subject determines the user; this never changes roles or assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200": { description: Updated application profile }
        "400": { description: Invalid display name }
        "401": { description: Unauthenticated }
        "404": { description: User not provisioned }
  /shared/outlets:
    get:
      operationId: listOutlets
      security: [{ bearerAuth: [] }]
      description: Requires outlets:read-internal, order:view-all, order:view-own, or fleet:view
      responses:
        "200": { description: Outlet list }
  /shared/outlets/{id}:
    get:
      operationId: getOutlet
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Outlet. latitude and longitude are the verified position when locationApproximate is false, otherwise the approximate district position (never navigate a driver to an approximate one)." }
        "404": { description: Missing }
    put:
      operationId: updateOutlet
      security: [{ bearerAuth: [] }]
      description: >
        Updates outlet master data (requires master-data update; If-Match / version for optimistic
        concurrency; audited). Optional `location` records the verified position:
        `{"latitude": 6.93441, "longitude": 79.84281}` sets it, `null` clears it (back to the approximate
        district position), absent leaves it unchanged. Latitude/longitude fields echoed at the top
        level are ignored. Values outside Sri Lanka (latitude 5.5-10.0, longitude 79.3-82.2), a half pair
        or extra keys are 400. The response is the outlet as a read returns it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated outlet }
        "400": { description: Invalid master data or location }
        "404": { description: Missing }
        "409": { description: The outlet changed since the version sent }
  /shared/outlets/{id}/notifications:
    get:
      operationId: listOutletNotifications
      security: [{ bearerAuth: [] }]
      description: >
        The notices the system stored for one outlet, newest first, at most 50. Every notice is stored
        in-app for the outlet, independently of its SMS consent, alert choices or whether it has any
        notification preferences at all; those only decide whether a notice is also sent by SMS. A store
        manager (order:view-own) may read only their assigned outlet; order:view-all (dispatchers) may
        read any outlet. Rows whose text was purged are omitted, and the phone number is never returned.
        status is the outbox state: PENDING/SENDING/QUEUED (waiting to be sent by SMS), SENT, DELIVERED,
        FAILED/UNKNOWN (SMS not sent), IN_APP_ONLY (stored for the Notifications page only; never sent
        by SMS because consent or this alert is off, or no SMS contact is on file). SUPPRESSED is a
        legacy value, whose text is no longer kept. Without an SMS provider configured (local
        environments) messages stay PENDING or become FAILED but the text is still returned.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Recent messages for the outlet
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [id, eventType, body, status, createdAt]
                      properties:
                        id: { type: integer, format: int64 }
                        eventType: { type: string, enum: [DEFERRAL, MAJOR_DELAY, ARRIVAL_CHANGE, DELIVERY_REJECTED, LOAD_SHORTFALL] }
                        body: { type: string }
                        status: { type: string, enum: [PENDING, SENDING, QUEUED, SENT, DELIVERED, FAILED, UNKNOWN, SUPPRESSED, IN_APP_ONLY] }
                        createdAt: { type: string, format: date-time }
        "401": { description: Unauthenticated }
        "403": { description: Not allowed to read this outlet }
        "404": { description: Outlet not found }
  /shared/travel:
    get:
      operationId: listTravel
      security: [{ bearerAuth: [] }]
      description: District travel table plus service allowances. Requires outlets:read-internal, order:view-all, or fleet:view
      responses:
        "200": { description: Travel rows }
  /shared/audit-events:
    post:
      operationId: ingestAuditEvent
      security: [{ bearerAuth: [] }]
      description: Requires M2M scope audit:write
      responses:
        "202": { description: Ingested }
        "401": { description: Unauthenticated }
        "403": { description: Missing audit:write }
  /shared/dashboards:
    get:
      operationId: listMyDashboards
      security: [{ bearerAuth: [] }]
      description: Saved dashboards owned by the signed-in user (dashboard:manage-own). Specs use the card vocabulary in assistants.yaml.
      responses:
        "200": { description: "{ items: [{ id, spec, version, createdAt, updatedAt }] }" }
        "403": { description: Role without dashboard:manage-own }
    post:
      operationId: createDashboard
      security: [{ bearerAuth: [] }]
      description: Saves a dashboard for the signed-in user only (body { spec }; unknown fields rejected; at most 12 per user). Audited as USER_DASHBOARD_CREATED.
      responses:
        "201": { description: Saved dashboard }
        "400": { description: Spec outside the fixed card vocabulary }
        "409": { description: Dashboard limit reached }
  /shared/dashboards/{id}:
    put:
      operationId: updateDashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: Body { spec, version }. Optimistic concurrency on version. Audited as USER_DASHBOARD_UPDATED.
      responses:
        "200": { description: Updated dashboard }
        "400": { description: Invalid spec }
        "404": { description: Not found or not owned by the caller }
        "409": { description: Stale version }
    delete:
      operationId: deleteDashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: Audited as USER_DASHBOARD_DELETED.
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not owned by the caller }
  /shared/audit/export.csv:
    get:
      operationId: exportAuditEventsCsv
      security: [{ bearerAuth: [] }]
      description: Requires audit:read. Same filters as audit search; capped at 5000 rows (X-Export-Truncated header says if more matched). Cells starting with = + - @ are prefixed with an apostrophe.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: CSV attachment
          content: { text/csv: { schema: { type: string } } }
        "400": { description: Invalid filter }
        "403": { description: Missing audit:read }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
