openapi: 3.1.0
info:
  title: Waypoint Shared Service
  version: 0.2.0
servers:
  - url: /api/v1
paths:
  /shared/profiles/me:
    get:
      operationId: getMyProfile
      security: [{ bearerAuth: [] }]
      description: Returns the application profile, including its stored displayName (empty until set).
      responses:
        "200": { description: Application profile }
        "401": { description: Unauthenticated }
        "404": { description: User not provisioned }
  /shared/profiles/me/display-name:
    put:
      operationId: updateMyDisplayName
      security: [{ bearerAuth: [] }]
      description: Updates the authenticated person's stored displayName (1-120 characters). The token subject determines the user; this never changes roles or assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayName]
              properties:
                displayName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200": { description: Updated application profile }
        "400": { description: Invalid display name }
        "401": { description: Unauthenticated }
        "404": { description: User not provisioned }
  /shared/outlets:
    get:
      operationId: listOutlets
      security: [{ bearerAuth: [] }]
      description: Requires outlets:read-internal, order:view-all, order:view-own, or fleet:view
      responses:
        "200": { description: Outlet list }
  /shared/outlets/{id}:
    get:
      operationId: getOutlet
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Outlet. latitude and longitude are the verified position when locationApproximate is false, otherwise the approximate district position (never navigate a driver to an approximate one)." }
        "404": { description: Missing }
    put:
      operationId: updateOutlet
      security: [{ bearerAuth: [] }]
      description: >
        Updates outlet master data (requires master-data update; If-Match / version for optimistic
        concurrency; audited). Optional `location` records the verified position:
        `{"latitude": 6.93441, "longitude": 79.84281}` sets it, `null` clears it (back to the approximate
        district position), absent leaves it unchanged. Latitude/longitude fields echoed at the top
        level are ignored. Values outside Sri Lanka (latitude 5.5-10.0, longitude 79.3-82.2), a half pair
        or extra keys are 400. The response is the outlet as a read returns it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated outlet }
        "400": { description: Invalid master data or location }
        "404": { description: Missing }
        "409": { description: The outlet changed since the version sent }
  /shared/travel:
    get:
      operationId: listTravel
      security: [{ bearerAuth: [] }]
      description: District travel table plus service allowances. Requires outlets:read-internal, order:view-all, or fleet:view
      responses:
        "200": { description: Travel rows }
  /shared/audit-events:
    post:
      operationId: ingestAuditEvent
      security: [{ bearerAuth: [] }]
      description: Requires M2M scope audit:write
      responses:
        "202": { description: Ingested }
        "401": { description: Unauthenticated }
        "403": { description: Missing audit:write }
  /shared/audit/export.csv:
    get:
      operationId: exportAuditEventsCsv
      security: [{ bearerAuth: [] }]
      description: Requires audit:read. Same filters as audit search; capped at 5000 rows (X-Export-Truncated header says if more matched). Cells starting with = + - @ are prefixed with an apostrophe.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: resourceType, in: query, schema: { type: string } }
        - { name: resourceId, in: query, schema: { type: string } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: CSV attachment
          content: { text/csv: { schema: { type: string } } }
        "400": { description: Invalid filter }
        "403": { description: Missing audit:read }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
