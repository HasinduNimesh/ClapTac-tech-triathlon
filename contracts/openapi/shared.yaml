openapi: 3.1.0
info:
  title: Waypoint Shared Service
  version: 0.2.0
servers:
  - url: /api/v1
paths:
  /shared/profiles/me:
    get:
      operationId: getMyProfile
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Application profile }
        "401": { description: Unauthenticated }
        "404": { description: User not provisioned }
  /shared/outlets:
    get:
      operationId: listOutlets
      security: [{ bearerAuth: [] }]
      description: Requires outlets:read-internal, order:view-all, order:view-own, or fleet:view
      responses:
        "200": { description: Outlet list }
  /shared/outlets/{id}:
    get:
      operationId: getOutlet
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Outlet }
        "404": { description: Missing }
  /shared/travel:
    get:
      operationId: listTravel
      security: [{ bearerAuth: [] }]
      description: District travel table plus service allowances. Requires outlets:read-internal, order:view-all, or fleet:view
      responses:
        "200": { description: Travel rows }
  /shared/audit-events:
    post:
      operationId: ingestAuditEvent
      security: [{ bearerAuth: [] }]
      description: Requires M2M scope audit:write
      responses:
        "202": { description: Ingested }
        "401": { description: Unauthenticated }
        "403": { description: Missing audit:write }
  /shared/dashboards:
    get:
      operationId: listMyDashboards
      security: [{ bearerAuth: [] }]
      description: Saved dashboards owned by the signed-in user (dashboard:manage-own). Specs use the card vocabulary in assistants.yaml.
      responses:
        "200": { description: "{ items: [{ id, spec, version, createdAt, updatedAt }] }" }
        "403": { description: Role without dashboard:manage-own }
    post:
      operationId: createDashboard
      security: [{ bearerAuth: [] }]
      description: Saves a dashboard for the signed-in user only (body { spec }; unknown fields rejected; at most 12 per user). Audited as USER_DASHBOARD_CREATED.
      responses:
        "201": { description: Saved dashboard }
        "400": { description: Spec outside the fixed card vocabulary }
        "409": { description: Dashboard limit reached }
  /shared/dashboards/{id}:
    put:
      operationId: updateDashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: Body { spec, version }. Optimistic concurrency on version. Audited as USER_DASHBOARD_UPDATED.
      responses:
        "200": { description: Updated dashboard }
        "400": { description: Invalid spec }
        "404": { description: Not found or not owned by the caller }
        "409": { description: Stale version }
    delete:
      operationId: deleteDashboard
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      description: Audited as USER_DASHBOARD_DELETED.
      responses:
        "204": { description: Deleted }
        "404": { description: Not found or not owned by the caller }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
