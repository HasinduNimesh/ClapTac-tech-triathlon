openapi: 3.1.0
info:
  title: Waypoint Planning Service
  version: 0.4.0
servers:
  - url: /api/v1
paths:
  /planning/plans:
    post:
      operationId: createPlan
      security: [{ bearerAuth: [] }]
      description: Requires plan:create. One unique plan per deliveryDate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deliveryDate]
              properties:
                deliveryDate: { type: string, format: date }
      responses:
        "201": { description: Created }
        "200": { description: Existing plan for that date }
        "400": { description: Invalid date }
        "401": { description: Unauthenticated }
        "403": { description: Missing plan:create }
    get:
      operationId: getPlanByDate
      security: [{ bearerAuth: [] }]
      description: Requires plan:view
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Plan detail }
        "404": { description: Missing }
  /planning/plans/{id}:
    get:
      operationId: getPlan
      security: [{ bearerAuth: [] }]
      description: Requires plan:view
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Plan, trips, allocations, deferrals, unallocated }
        "404": { description: Missing }
  /planning/plans/{id}/simulate:
    post:
      operationId: simulatePlan
      security: [{ bearerAuth: [] }]
      description: Requires plan:view. Runs the deterministic allocation engine against current data without persisting assignments or changing plan state.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Proposed allocations and deterministic constraint failures; no writes }
        "403": { description: Dispatcher role required }
        "404": { description: Missing plan }
  /planning/plans/{id}/generate:
    post:
      operationId: generatePlan
      security: [{ bearerAuth: [] }]
      description: Requires plan:update. Generate-once unless reset.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Allocation result }
        "409": { description: Already generated or confirmed }
  /planning/plans/{id}/reset:
    post:
      operationId: resetPlan
      security: [{ bearerAuth: [] }]
      description: Requires plan:update. Clears allocations and generated_at.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Reset }
        "409": { description: Confirmed }
  /planning/plans/{id}/allocations:
    post:
      operationId: assignOrder
      security: [{ bearerAuth: [] }]
      description: Requires allocation:create. Backend revalidates every assignment.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, vehicleId, tripNumber, reason]
              properties:
                orderId: { type: string }
                vehicleId: { type: string }
                tripNumber: { type: integer, enum: [1, 2] }
                reason: { type: string, minLength: 3, maxLength: 500, description: "Why this order is being manually assigned (FR-54)." }
      responses:
        "201": { description: Allocated }
        "409": { description: Constraint failure }
  /planning/plans/{id}/allocations/{allocId}:
    put:
      operationId: reassignOrder
      security: [{ bearerAuth: [] }]
      description: Requires allocation:update
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: allocId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId, tripNumber, reason]
              properties:
                vehicleId: { type: string }
                tripNumber: { type: integer, enum: [1, 2] }
                reason: { type: string, minLength: 3, maxLength: 500, description: "Why this order is being manually reassigned (FR-54)." }
      responses:
        "200": { description: Reassigned }
        "409": { description: Constraint failure }
    delete:
      operationId: removeAllocation
      security: [{ bearerAuth: [] }]
      description: Requires allocation:update
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: allocId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
  /planning/plans/{id}/deferrals:
    post:
      operationId: deferOrder
      security: [{ bearerAuth: [] }]
      description: Requires order:defer. Structured reason codes only.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, reasonCode]
              properties:
                orderId: { type: string }
                reasonCode:
                  type: string
                  enum:
                    - NO_ELIGIBLE_VEHICLE
                    - WEIGHT_CAPACITY_EXCEEDED
                    - VOLUME_CAPACITY_EXCEEDED
                    - REFRIGERATION_REQUIRED
                    - VAN_REQUIRED
                    - DEPOT_MISMATCH
                    - DELIVERY_WINDOW_CONFLICT
                    - FUEL_QUOTA_EXCEEDED
                    - TRIP_LIMIT_REACHED
                    - VEHICLE_UNAVAILABLE
                    - MANUAL_DISPATCHER_DEFERRAL
                comment: { type: string }
                nextRunTarget: { type: string, format: date, description: "Expected retry date (FR-53); optional, must be after this plan's delivery date." }
      responses:
        "201": { description: Deferred }
        "400": { description: Invalid reason }
        "409": { description: Order already allocated }
  /planning/plans/{id}/confirm:
    post:
      operationId: confirmPlan
      security: [{ bearerAuth: [] }]
      description: Requires plan:update. Every order must be allocated or deferred.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Confirmed }
        "409": { description: Unresolved orders or constraint failure }
  /planning/plans/{id}/acknowledgements:
    post:
      operationId: acknowledgePlanVersion
      security: [{ bearerAuth: [] }]
      description: >-
        Requires plan:acknowledge (driver or loader). Records the caller's receipt of the current published version for one trip.
        tripId is optional only for legacy clients; a receipt without a trip is plan-level and does not mark any trip acknowledged.
        A driver may acknowledge only a trip of their assigned vehicle and a loader only a trip of their depot. Repeating is idempotent.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
                tripId: { type: string, format: uuid, description: "Trip of this plan the receipt covers." }
      responses:
        "200": { description: Acknowledged }
        "403": { description: Trip belongs to another vehicle or depot }
        "404": { description: Plan not found, or tripId is not a trip of this plan }
        "409": { description: Plan not published or version is stale }
  /planning/plans/{id}/reminders:
    post:
      operationId: sendPlanAcknowledgementReminder
      security: [{ bearerAuth: [] }]
      description: >-
        Requires plan:update (dispatcher). Records a persisted reminder asking the trip's driver or loader to acknowledge the current
        plan version, writes a PLAN_ACK_REMINDER_SENT audit event (trip, audience, version, actor) and, for DRIVER, posts a message on
        the delivery trip message channel as the calling dispatcher. A repeat for the same trip, audience and version within 5 minutes
        changes nothing and returns the earlier reminder with alreadySent=true.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tripId, audience]
              properties:
                tripId: { type: string, format: uuid }
                audience: { type: string, enum: [DRIVER, LOADER] }
      responses:
        "200":
          description: Reminder recorded, or already sent within the last 5 minutes
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminder:
                    type: object
                    properties:
                      tripId: { type: string }
                      audience: { type: string, enum: [DRIVER, LOADER] }
                      version: { type: integer }
                      remindedAt: { type: string, format: date-time }
                      remindedBy: { type: string }
                  alreadySent: { type: boolean }
                  tripMessage: { type: string, description: "DRIVER only: 'sent', or 'unavailable' when the driver has not prepared the trip run yet; the persisted reminder is still shown in the driver app." }
        "400": { description: Missing tripId or invalid audience }
        "403": { description: Caller lacks plan:update }
        "404": { description: tripId is not a trip of this plan }
        "409": { description: Plan not published, or that recipient already acknowledged the trip }
    get:
      operationId: listPlanAcknowledgementReminders
      security: [{ bearerAuth: [] }]
      description: Requires plan:acknowledge (driver or loader). Reminders for the current published version addressed to the caller's role, optionally for one trip.
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: tripId, in: query, schema: { type: string } }
      responses:
        "200": { description: Reminders addressed to the caller's role }
        "403": { description: Not a driver or loader }
  /planning/plans/{id}/breakdowns/proposals:
    get:
      operationId: getBreakdownProposals
      security: [{ bearerAuth: [] }]
      description: Requires plan:view. Rescue options, with hard-constraint checks, for the trips a broken-down vehicle can no longer serve.
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: vehicleId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Affected trips with feasible and blocked replacement vehicles }
        "400": { description: vehicleId missing }
  /planning/plans/{id}/breakdowns/reassign:
    post:
      operationId: confirmBreakdownReassignment
      security: [{ bearerAuth: [] }]
      description: >
        Requires plan:update. Moves one affected trip to a replacement vehicle, publishes the revised plan as a new
        version and puts the broken vehicle in the workshop (fleet availability in_workshop) for the plan's delivery date.
        The response is `confirmed` only when BOTH the revision is committed and the vehicle is in the workshop
        (`vehicleInWorkshop` is then always true). The workshop update runs first, before anything is committed; if
        fleet-service cannot apply it the call fails with 502 and code `workshop_pending`, nothing is committed, no plan
        version or audit event is created, and the identical request can simply be retried. The fleet update is an
        upsert, so repeating it is harmless.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceVehicleId, replacementVehicleId, tripNumber]
              properties:
                sourceVehicleId: { type: string }
                replacementVehicleId: { type: string }
                tripNumber: { type: integer, minimum: 1, maximum: 2 }
      responses:
        "200":
          description: Revision committed and vehicle in the workshop
          content:
            application/json:
              schema:
                type: object
                required: [status, planVersion, vehicleInWorkshop]
                properties:
                  status: { type: string, enum: [confirmed] }
                  planVersion: { type: integer }
                  sourceVehicleId: { type: string }
                  replacementVehicleId: { type: string }
                  tripNumber: { type: integer }
                  movedStops: { type: integer }
                  vehicleInWorkshop: { type: boolean, enum: [true] }
                  decidedBy: { type: string }
                  noticeDrafts:
                    type: array
                    items:
                      type: object
                      properties:
                        orderRef: { type: string }
                        outletId: { type: string }
                        estimatedArrival: { type: string, format: date-time }
        "400": { description: Invalid request }
        "404": { description: Plan or affected trip not found }
        "409": { description: Replacement vehicle failed a hard constraint, or the plan is not generated yet }
        "502":
          description: >
            The vehicle could not be put in the workshop (fleet-service failure). The recovery is NOT complete, nothing
            was committed, and the same request is safe to retry. Clients must show an unresolved state with a Retry
            and must not report success.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              example: { type: "about:blank", title: Bad Gateway, status: 502, detail: "workshop_pending: vehicle VEH001 could not be marked in the workshop, so the recovery is not complete and the plan was not changed; retry the same request", code: workshop_pending }
  /planning/internal/trips:
    get:
      operationId: listConfirmedTripsInternal
      security: [{ bearerAuth: [] }]
      description: Requires plan:view or plans:read-internal. Confirmed plans only.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: depot, in: query, schema: { type: string } }
      responses:
        "200": { description: Confirmed trips }
  /planning/internal/trips/{tripId}:
    get:
      operationId: getConfirmedTripInternal
      security: [{ bearerAuth: [] }]
      description: Requires plan:view or plans:read-internal
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Confirmed trip with allocations and vehicle fields }
        "404": { description: Missing or not confirmed }
  /planning/internal/orders/{orderId}:
    get:
      operationId: getInternalOrderPlanning
      security: [{ bearerAuth: [] }]
      description: Narrow order planning state, deferral reason, stop and persisted ETA. Requires plans:read-internal.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Planning state and persisted stop times }
        "401": { description: Unauthenticated }
        "403": { description: Missing internal-read scope }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
