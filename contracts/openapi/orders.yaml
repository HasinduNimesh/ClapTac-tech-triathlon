openapi: 3.1.0
info:
  title: Waypoint Order Service
  version: 0.2.0
servers:
  - url: /api/v1
paths:
  /orders:
    get:
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: brand, in: query, schema: { type: string } }
        - { name: outlet_id, in: query, schema: { type: string } }
        - { name: requested_delivery_date, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrder" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /orders/internal/delivery-followups:
    post:
      operationId: createDeliveryFollowup
      description: Delivery-service only; idempotently clones a rejected stop's goods as a confirmed order for the next operating run.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceOrderId, stopId, tripDate, units, resolution]
              properties:
                sourceOrderId: { type: string }
                stopId: { type: string }
                tripDate: { type: string, format: date }
                units: { type: integer, minimum: 1 }
                resolution: { type: string, enum: [NEXT_RUN, REQUEST_DEFERRAL] }
      responses:
        "200": { description: Created or existing follow-up order }
        "403": { description: Internal order scope required }
  /orders/forecast:
    get:
      operationId: getOrderForecast
      security: [{ bearerAuth: [] }]
      description: >
        Deterministic demand estimate for the next ten weeks (horizonWeeks, 70 days), starting with the
        current Monday-based week in Sri Lanka time. The baseline is the mean of confirmed order volume
        over the previous four complete weeks, held flat across the horizon: no trend or seasonality is
        modelled, so beyond the first week the estimate is stationary. Every depot/brand bucket carries a
        rangePercent, the half-width of its likely range, that widens with distance (10 percent in
        horizon week 1, plus 2 points for each week further out, so 28 percent in week 10); the range is a
        planning heuristic, not a calibrated interval. Weekly rows are ordered by week then depot and
        brand, and all ten weeks are returned whenever any history exists (none when there is none).
        capacity compares the projected weight and volume of the busiest projected week with the
        fleet's estimated capacity per depot. Requires order:view-all.
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecast: { $ref: "#/components/schemas/Forecast" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orders/cutoff:
    get:
      operationId: getOrderCutoff
      security: [{ bearerAuth: [] }]
      description: >
        The daily order cutoff the service applies, as HH:MM in Sri Lanka time: the planning policy's
        (a dispatcher can change it), or 16:00 when the policy cannot be read. Screens that tell people
        the cutoff read it from here. Requires order:view-own or order:view-all.
      responses:
        "200":
          description: Cutoff
          content:
            application/json:
              schema:
                type: object
                properties:
                  cutoff:
                    type: object
                    properties:
                      localTime: { type: string, example: "16:00" }
                      timezone: { type: string, example: Asia/Colombo }
  /orders/{id}:
    get:
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/receipts/pending:
    get:
      operationId: listPendingReceipts
      description: Each item carries reportBy (end of the 2nd working day after delivery, operating calendar) and reportState (open, due_tomorrow, due_today, overdue); tracking carries the same as receiptDue.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Pending receipt confirmations for authorized outlet or dispatcher view }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orders/receipt-issues:
    get:
      operationId: listReceiptIssues
      security: [{ bearerAuth: [] }]
      description: Dispatcher-only read-only receipt issue view.
      responses:
        "200": { description: Reported receipt issues }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orders/{id}/tracking:
    get:
      operationId: getOrderTracking
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Aggregated order, planning, delivery, and receipt state }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orders/{id}/receipt:
    get:
      operationId: getOrderReceipt
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Receipt and discrepancy records }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orders/{id}/receipt/confirm:
    post:
      operationId: confirmOrderReceipt
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receivedUnits]
              properties:
                receivedUnits: { type: integer, minimum: 1 }
                receivedTemperatureC: { type: number, minimum: -40, maximum: 60, description: Optional manual reading of chilled goods on arrival. Chilled orders only. }
                issue: { $ref: "#/components/schemas/ReceiptIssueRequest" }
      responses:
        "201": { description: Receipt confirmed }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Delivery has no receivable terminal outcome or receipt conflicts }
  /orders/{id}/receipt/issues:
    post:
      operationId: reportReceiptIssue
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ID" }, { name: Idempotency-Key, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptIssueRequest" }
      responses:
        "201": { description: Receipt issue recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: No receipt or idempotency conflict }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
  schemas:
    Forecast:
      type: object
      properties:
        generatedAt: { type: string, format: date-time }
        forecastVersion: { type: string, example: confirmed_order_mean_v2 }
        method: { type: string }
        historyWeeks: { type: integer, example: 4, description: Complete prior weeks averaged into the baseline. }
        horizonWeeks: { type: integer, example: 10, description: Weeks projected ahead; weekly holds this many distinct weekStarting values. }
        weekly:
          type: array
          items: { $ref: "#/components/schemas/ForecastBucket" }
        capacity:
          type: array
          items:
            type: object
            properties:
              depot: { type: string }
              projectedWeightKg: { type: number }
              projectedVolumeM3: { type: number }
              estimatedWeightCapacityKg: { type: number }
              estimatedVolumeCapacityM3: { type: number }
              pressure: { type: string, enum: [low, medium, high] }
        inputDrift: { type: array, items: { type: object } }
        serviceTimeEvaluation: { type: array, items: { type: object } }
    ForecastBucket:
      type: object
      properties:
        weekStarting: { type: string, format: date }
        horizonWeek: { type: integer, minimum: 1, maximum: 10, description: 1 is the current week. }
        rangePercent: { type: number, description: Half-width of the likely range in percent; widens with horizonWeek. }
        depot: { type: string }
        brand: { type: string }
        chilledOrders: { type: integer }
        ambientOrders: { type: integer }
        estimatedWeightKg: { type: number }
        estimatedVolumeM3: { type: number }
        estimate: { type: boolean }
    CreateOrder:
      type: object
      required: [requestedDeliveryDate, orderUnits, orderWeightKg, orderVolumeM3, temperatureRequirement]
      properties:
        requestedDeliveryDate: { type: string, format: date }
        orderUnits: { type: integer, exclusiveMinimum: 0 }
        orderWeightKg: { type: number, exclusiveMinimum: 0 }
        orderVolumeM3: { type: number, exclusiveMinimum: 0 }
        temperatureRequirement: { type: string, enum: [ambient, chilled] }
    Order:
      type: object
      properties:
        id: { type: string }
        orderRef: { type: string }
        outletId: { type: string }
        brand: { type: string }
        requestedDeliveryDate: { type: string }
        orderUnits: { type: integer }
        orderWeightKg: { type: number }
        orderVolumeM3: { type: number }
        temperatureRequirement: { type: string }
        status: { type: string }
        createdBy: { type: string }
    ReceiptIssueRequest:
      type: object
      required: [issueType, affectedUnits, idempotencyKey]
      properties:
        issueType: { type: string, enum: [MISSING, DAMAGED, QUANTITY_MISMATCH, OTHER] }
        affectedUnits: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 1000 }
        idempotencyKey: { type: string }
  responses:
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Unauthenticated
    Forbidden:
      description: Not authorized
    NotFound:
      description: Missing
    Internal:
      description: Unexpected error
