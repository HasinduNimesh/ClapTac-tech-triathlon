openapi: 3.1.0
info:
  title: Waypoint Loading Service
  version: 0.4.0
servers:
  - url: /api/v1
paths:
  /loading/trips:
    get:
      operationId: listLoadingTrips
      summary: Confirmed depot trips for a delivery date
      description: Requires loading:view (depot-scoped) or loading:view-all.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Trip summaries with loading counters }
        "400": { description: date required }
        "403": { description: Missing permission or depot }
  /loading/trips/{tripId}:
    get:
      operationId: getLoadingTrip
      description: Snapshot after start; planning view before start.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200": { description: Trip loading detail with suggested load order }
        "404": { description: Trip not found }
  /loading/trips/{tripId}/start:
    post:
      operationId: startLoading
      description: Atomic snapshot of allocated orders. Idempotent. LOADER + depot only.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200": { description: Session in progress }
        "409": { description: Trip is not on a confirmed plan }
  /loading/trips/{tripId}/orders/{orderId}/loaded:
    put:
      operationId: markOrderLoaded
      description: Forbidden while any issue is active (409 ACTIVE_LOADING_ISSUE).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200": { description: Marked loaded }
        "409": { description: ACTIVE_LOADING_ISSUE or session ready }
  /loading/trips/{tripId}/orders/{orderId}/issues:
    post:
      operationId: createLoadingIssue
      description: Record MISSING or DAMAGED. Unique Idempotency-Key.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, affectedUnits]
              properties:
                type: { type: string, enum: [MISSING, DAMAGED] }
                affectedUnits: { type: integer, minimum: 1 }
                note: { type: string }
      responses:
        "201": { description: Issue created or replayed }
        "400": { description: Invalid type, units, or missing key }
  /loading/trips/{tripId}/orders/{orderId}/issues/{issueId}:
    put:
      operationId: updateLoadingIssue
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IssueID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [MISSING, DAMAGED] }
                affectedUnits: { type: integer, minimum: 1 }
                note: { type: string }
      responses:
        "200": { description: Updated }
    delete:
      operationId: deleteLoadingIssue
      description: After the last issue is removed the order stays SHORTFALL until explicitly loaded.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IssueID"
      responses:
        "200": { description: Removed }
  /loading/trips/{tripId}/orders/{orderId}/issues/{issueId}/decision:
    post:
      operationId: decideLoadingIssue
      description: >-
        Dispatcher decision on a loader shortfall (loading:decide). PARTIAL_LOAD and
        MOVE_TO_NEXT_RUN let the trip depart; HOLD keeps Ready blocked. The order is not
        reduced here: moving a line to the next run is done in planning, which publishes a
        new plan version. Changing the report clears an earlier decision.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IssueID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [PARTIAL_LOAD, HOLD, MOVE_TO_NEXT_RUN] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Decision recorded; returns the issue with decision, decidedBy and decidedAt }
        "400": { description: Unknown decision }
        "403": { description: Caller is not a dispatcher }
        "409": { description: Loading session is already ready }
  /loading/trips/{tripId}/ready:
    post:
      operationId: markTripReady
      description: >-
        Atomic and immutable. Pending orders block (409 loading_incomplete). A shortfall blocks
        until the dispatcher accepts a partial load or moves the line (409 dispatcher_decision_required).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200": { description: Ready for departure }
        "409": { description: loading_incomplete }
  /loading/internal/trips:
    get:
      operationId: listReadyTripsInternal
      description: Ready-for-departure snapshots for delivery-service. Requires loading:read-internal or loading:view-all.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: vehicleId
          in: query
          schema: { type: string }
      responses:
        "200": { description: Ready trip DTOs }
  /loading/internal/trips/{tripId}:
    get:
      operationId: getReadyTripInternal
      description: 409 if the trip is not READY. Delivery must not mutate loading.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200": { description: Ready trip snapshot }
        "409": { description: Trip is not ready for departure }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripID:
      name: tripId
      in: path
      required: true
      schema: { type: string }
    OrderID:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    IssueID:
      name: issueId
      in: path
      required: true
      schema: { type: string }
