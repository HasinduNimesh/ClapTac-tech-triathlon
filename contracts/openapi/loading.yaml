openapi: 3.1.0
info:
  title: Waypoint Loading Service
  version: 0.4.0
servers:
  - url: /api/v1
paths:
  /loading/trips:
    get:
      operationId: listLoadingTrips
      summary: Confirmed depot trips for a delivery date
      description: Requires loading:view (depot-scoped) or loading:view-all.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Trip summaries with loading counters }
        "400": { description: date required }
        "403": { description: Missing permission or depot }
  /loading/trips/{tripId}:
    get:
      operationId: getLoadingTrip
      description: Snapshot after start; planning view before start.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200": { description: Trip loading detail with suggested load order }
        "404": { description: Trip not found }
  /loading/trips/{tripId}/start:
    post:
      operationId: startLoading
      description: Atomic snapshot of allocated orders. Idempotent. LOADER + depot only.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200": { description: Session in progress }
        "409": { description: Trip is not on a confirmed plan }
  /loading/trips/{tripId}/orders/{orderId}/loaded:
    put:
      operationId: markOrderLoaded
      description: Forbidden while any issue is active (409 ACTIVE_LOADING_ISSUE).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
      responses:
        "200": { description: Marked loaded }
        "409": { description: ACTIVE_LOADING_ISSUE or session ready }
  /loading/trips/{tripId}/orders/{orderId}/issues:
    post:
      operationId: createLoadingIssue
      description: Record MISSING, DAMAGED or WRONG_ITEM. Unique Idempotency-Key. Attach a photo afterwards with the photo endpoint.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, affectedUnits]
              properties:
                type: { type: string, enum: [MISSING, DAMAGED, WRONG_ITEM] }
                affectedUnits: { type: integer, minimum: 1 }
                note: { type: string }
      responses:
        "201": { description: Issue created or replayed }
        "400": { description: Invalid type, units, or missing key }
  /loading/trips/{tripId}/orders/{orderId}/issues/{issueId}:
    put:
      operationId: updateLoadingIssue
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IssueID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [MISSING, DAMAGED, WRONG_ITEM] }
                affectedUnits: { type: integer, minimum: 1 }
                note: { type: string }
      responses:
        "200": { description: Updated }
    delete:
      operationId: deleteLoadingIssue
      description: Withdraws a report. After the last report is removed the order goes back to PENDING and must be loaded or reported again.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IssueID"
      responses:
        "200": { description: Removed }
  /loading/trips/{tripId}/orders/{orderId}/issues/{issueId}/decision:
    post:
      operationId: decideLoadingIssue
      description: >-
        Dispatcher decision on a loader shortfall (loading:decide). PARTIAL_LOAD lets the trip
        depart; HOLD keeps Ready blocked. MOVE_TO_NEXT_RUN is recorded but lets the trip depart
        only once the order is absent from the confirmed plan the session is loading against:
        the move itself is done in planning (revise, remove the allocation, defer, confirm),
        which publishes a new plan version the loader acknowledges. Until then Ready is refused
        (409 dispatcher_decision_required, moveUnpublishedOrderIds). The order is not reduced
        here. Changing the report clears an earlier decision.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IssueID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [PARTIAL_LOAD, HOLD, MOVE_TO_NEXT_RUN] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { description: Decision recorded; returns the issue with decision, decidedBy and decidedAt }
        "400": { description: Unknown decision }
        "403": { description: Caller is not a dispatcher }
        "409": { description: Loading session is already ready }
  /loading/trips/{tripId}/orders/{orderId}/issues/{issueId}/photo:
    post:
      operationId: attachLoadingIssuePhoto
      description: Attach a PNG or JPEG photo (max 4 MB) of the missing, damaged or wrong goods. A newer photo replaces the earlier one.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IssueID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200": { description: Photo stored; returns the issue with hasPhoto true }
        "400": { description: Not a PNG or JPEG, or empty }
        "413": { description: Photo too large }
    get:
      operationId: getLoadingIssuePhoto
      description: The report photo, for a loader at that depot or a dispatcher. Not cached.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IssueID"
      responses:
        "200":
          description: Photo bytes
          content:
            image/jpeg: {}
            image/png: {}
        "404": { description: No photo }
  /loading/trips/{tripId}/orders/{orderId}/issues/{issueId}/seen:
    post:
      operationId: markLoadingIssueSeen
      description: Records the first time a dispatcher opened the report (loading:decide), so the loader sees it was seen.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - $ref: "#/components/parameters/OrderID"
        - $ref: "#/components/parameters/IssueID"
      responses:
        "200": { description: Seen recorded (idempotent) }
  /loading/trips/{tripId}/sync:
    post:
      operationId: syncLoadingPlanVersion
      description: >-
        Moves a started loading session onto the dispatcher's newer plan version after the loader
        acknowledged it in planning. Orders added to the trip become pending lines, orders taken off
        are removed, and lines whose stop moved are re-sequenced with a change note; a moved line that
        was already loaded goes back to pending for a recheck.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - name: If-Match
          in: header
          schema: { type: string }
          description: The plan version being acknowledged.
      responses:
        "200": { description: Loading detail on the new plan version }
        "409": { description: Version not acknowledged yet, changed again, or loading not in progress }
  /loading/trips/{tripId}/alerts:
    post:
      operationId: raiseDockAlert
      description: The loader's "tell dispatcher", e.g. goods for another vehicle staged at this one (WRONG_VEHICLE). Unique Idempotency-Key.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderRef]
              properties:
                type: { type: string, enum: [WRONG_VEHICLE] }
                orderRef: { type: string, maxLength: 64 }
                belongsVehicleId: { type: string }
                note: { type: string, maxLength: 500 }
      responses:
        "201": { description: Alert raised or replayed }
  /loading/alerts:
    get:
      operationId: listDockAlerts
      description: A date's dock alerts; loaders see their depot, dispatchers every depot.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Dock alerts, newest first }
  /loading/alerts/{alertId}/resolve:
    post:
      operationId: resolveDockAlert
      description: Dispatcher marks a dock alert handled (loading:decide).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Alert resolved }
  /loading/trips/{tripId}/ready:
    post:
      operationId: markTripReady
      description: >-
        Atomic and immutable. Pending orders block (409 loading_incomplete). A shortfall blocks
        until the dispatcher accepts a partial load, or moves the line and the confirmed plan no
        longer carries it (409 dispatcher_decision_required).
        On a refrigerated vehicle the departure checks are required: a chilled-zone reading
        (chilledTemperatureC, which must be 2-4 °C) and the door seal (sealNumber). A request
        without them is refused with 400, and a reading outside the range with 409. For any other
        vehicle they are optional but still validated when sent.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                chilledTemperatureC: { type: number, minimum: -30, maximum: 30, description: Required for a refrigerated vehicle; must be 2-4 °C there. }
                sealNumber: { type: string, maxLength: 40 }
      responses:
        "200": { description: Ready for departure }
        "400": { description: A refrigerated vehicle without chilledTemperatureC or sealNumber, or an impossible value }
        "409": { description: loading_incomplete, dispatcher_decision_required, plan not acknowledged, or chilled zone out of range }
  /loading/internal/trips:
    get:
      operationId: listReadyTripsInternal
      description: Ready-for-departure snapshots for delivery-service. Requires loading:read-internal or loading:view-all.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: vehicleId
          in: query
          schema: { type: string }
      responses:
        "200": { description: Ready trip DTOs }
  /loading/internal/trips/{tripId}:
    get:
      operationId: getReadyTripInternal
      description: 409 if the trip is not READY. Delivery must not mutate loading.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/TripID"
      responses:
        "200": { description: Ready trip snapshot }
        "409": { description: Trip is not ready for departure }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TripID:
      name: tripId
      in: path
      required: true
      schema: { type: string }
    OrderID:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    IssueID:
      name: issueId
      in: path
      required: true
      schema: { type: string }
