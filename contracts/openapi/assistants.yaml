openapi: 3.1.0
info:
  title: Waypoint Order and Dashboard Assistants (A1, A2)
  version: 0.1.0
  description: >
    Python/LangGraph service in the agent tier. It has no database connection and reads business
    services with the caller's own bearer token. Both endpoints only return drafts: the order form
    (POST /orders) and the saved-dashboard API (/shared/dashboards) remain the only ways to change data.
    Without LLM_BASE_URL/LLM_MODEL every draft endpoint returns 503 agent_unavailable and the screens
    keep working without the helper.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Product:
      type: object
      properties:
        id: { type: string }
        family: { type: string }
        name: { type: string }
        size: { type: string }
        pack: { type: string }
        unitsPerPack: { type: integer }
        packWeightKg: { type: number }
        packVolumeM3: { type: number }
        temperature: { type: string, enum: [ambient, chilled] }
    Line:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        pack: { type: string }
        unitsPerPack: { type: integer }
        quantity: { type: integer, description: Number of packs (order units) }
        weightKg: { type: number }
        volumeM3: { type: number }
        temperature: { type: string, enum: [ambient, chilled] }
        sourceText: { type: string }
    Question:
      type: object
      properties:
        kind: { type: string, enum: [choose_product, quantity, not_in_catalog, previous_not_found, date] }
        sourceText: { type: string }
        question: { type: string }
        options: { type: array, items: { $ref: "#/components/schemas/Product" } }
        suggestedQuantity: { type: [integer, "null"] }
    DashboardSpec:
      type: object
      required: [name, cards]
      description: Card ids are the store-manager cards in apps/web/src/store-manager/dashboards.ts.
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        cards:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items: { type: string, enum: [deadlines, receipts, short, ontime, shortByWeek, deferrals, chilled, arrivals] }
        filter: { type: string, enum: [all, chilled, ambient], default: all }
paths:
  /agent/assistants/status:
    get:
      operationId: assistantStatus
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Whether the helpers are switched on (a provider is configured)
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderAssistant: { type: boolean }
                  dashboardAssistant: { type: boolean }
        "401": { description: Authentication required }
        "403": { description: Store Manager with an outlet required }
  /agent/order-assistant/drafts:
    post:
      operationId: draftOrderFromText
      description: >
        A1. Reads a casual order ("same as last Tuesday", "rice 10 bags, oil 24 bottles, and yoghurt as usual").
        The model only records what was written; products, packs, totals, previous-order lookup and dates are
        resolved in code against the brand catalog and the outlet's own orders. Unclear items become questions.
        Never submits.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Draft for the manager to check
          content:
            application/json:
              schema:
                type: object
                properties:
                  drafts:
                    type: array
                    description: One per temperature (ambient and chilled are separate orders)
                    items:
                      type: object
                      properties:
                        temperatureRequirement: { type: string }
                        lines: { type: array, items: { $ref: "#/components/schemas/Line" } }
                        totals:
                          type: object
                          properties:
                            orderUnits: { type: integer }
                            orderWeightKg: { type: number }
                            orderVolumeM3: { type: number }
                  lines: { type: array, items: { $ref: "#/components/schemas/Line" } }
                  questions: { type: array, items: { $ref: "#/components/schemas/Question" } }
                  previousOrder: { type: [object, "null"] }
                  neededBy: { type: [string, "null"], format: date }
                  products: { type: array, items: { $ref: "#/components/schemas/Product" } }
                  catalogVersion: { type: string }
                  submitted: { type: boolean, const: false }
        "400": { description: Invalid message, content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { description: Authentication required }
        "403": { description: Store Manager with an outlet required }
        "413": { description: Request body too large }
        "503": { description: agent_unavailable; fill in the form by hand }
  /agent/dashboard-assistant/drafts:
    post:
      operationId: draftDashboard
      description: >
        A2. Applies a plain request to the current draft and returns the full dashboard (name, card ids in
        order, goods filter). Stateless: the browser sends the draft back each turn, so Cancel leaves nothing
        behind. Cards come only from the eight store-manager card ids; the spec has no outlet or user fields,
        and the web app computes cards from the person's own data. Never saves.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 1000 }
                draft: { $ref: "#/components/schemas/DashboardSpec" }
                locale: { type: string, enum: [en, si, ta] }
      responses:
        "200":
          description: Updated draft for the live preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  draft: { $ref: "#/components/schemas/DashboardSpec" }
                  question: { type: [string, "null"] }
                  reply: { type: string }
                  rejected: { type: array, items: { type: string } }
                  saved: { type: boolean, const: false }
        "400": { description: Invalid message }
        "401": { description: Authentication required }
        "403": { description: Store Manager with an outlet required }
        "503": { description: agent_unavailable; saved dashboards still work }
