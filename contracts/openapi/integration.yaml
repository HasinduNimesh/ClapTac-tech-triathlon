openapi: 3.1.0
info:
  title: Waypoint Integration Service
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /integrations/routing/directions:
    post:
      operationId: directions
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Directions placeholder }
  /integrations/storage/presign:
    post:
      operationId: presignObject
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Presigned URL placeholder }
  /integrations/notifications/send:
    post:
      operationId: sendExternalNotification
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Adapter placeholder }
  /integrations/notifications/status:
    post:
      operationId: smsStatusCallback
      security: []
      description: "Provider callback (Twilio). No bearer token; the X-Twilio-Signature header is verified."
      responses:
        "200": { description: "Accepted" }
        "403": { description: "Bad signature" }
  /integrations/notifications/gateway:
    post:
      operationId: smsGatewayWebhook
      security: []
      description: "Provider callback (cellular gateway). No bearer token; the X-CG-Signature header is an HMAC of the body. SMS_SENT marks a text sent and SMS_FAILED marks it failed. The gateway sends no delivery receipt, so SENT is final."
      responses:
        "200": { description: "Accepted or ignored" }
        "401": { description: "Bad signature" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
