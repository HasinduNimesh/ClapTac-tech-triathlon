server {
  listen 80;
  root /usr/share/nginx/html;

  location = /loader-app { return 301 /loader-app/; }
  location /loader-app/ {
    try_files $uri $uri/ /loader-app/index.html;
  }
  location ~* /loader-app/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js)$ {
    add_header Cache-Control "no-cache";
  }
}
