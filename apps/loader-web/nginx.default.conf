server {
  listen 80;
  root /usr/share/nginx/html;

  location = /loader-app { return 301 /loader-app/; }
  location /loader-app/ {
    try_files $uri $uri/ /loader-app/index.html;
    # The app's files keep the same names from one release to the next (main.dart.js and the rest), so a browser
    # that guesses how long to keep them can go on running the previous release for days. Make it ask every time;
    # an unchanged file costs a small 304 answer, a changed one is fetched.
    add_header Cache-Control "no-cache";
  }
}
