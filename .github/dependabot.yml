# Minor and patch updates arrive as one grouped PR per ecosystem. Major versions, and base-image
# version jumps (Go, Python, Node, Alpine), are skipped on purpose: they need a planned upgrade,
# not an automatic PR. Security updates are not affected by these ignores.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      go-dependencies: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      web-dependencies: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pub
    directory: /apps/driver-mobile
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      driver-dependencies: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pub
    directory: /apps/loader-web
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      loader-dependencies: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /services/agent-assistants
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      assistants-dependencies: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /services/agent-assistants
    schedule: { interval: weekly }
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 2
    groups:
      actions: { update-types: [minor, patch] }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
